<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google TV Android 14 Launcher</title>
  <style>
    /* RESET & VARIÁVEIS GOOGLE TV / MATERIAL 3 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d0e11;
      font-family: 'Google Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* BACKGROUND COM VÍDEO EM LOOP (HERO IMMERSIVE) */
    .bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
      transition: opacity 0.8s ease;
    }

    /* SOBREPOSIÇÃO DE SOMBRA/ESCURIDÃO (GRADIENTE DUAL) */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 80% 20%, rgba(0, 0, 0, 0.2) 0%, rgba(13, 14, 17, 0.85) 100%),
        linear-gradient(to top, #0d0e11 15%, rgba(13, 14, 17, 0.6) 50%, rgba(13, 14, 17, 0.3) 100%);
      z-index: 2;
    }

    /* ESTRUTURA PRINCIPAL */
    .app-container {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem 4.5rem 2.5rem 4.5rem;
    }

    /* TOP BAR (PÍLULAS DE NAVEGAÇÃO) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      margin-right: 0.5rem;
    }

    .nav-pill {
      padding: 0.55rem 1.3rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 5rem;
      color: #e3e2e6;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-pill.active {
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
    }

    .nav-pill:focus, .icon-btn:focus {
      outline: none;
      background-color: #ffffff;
      color: #000000;
      transform: scale(1.05);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #c4c6d0;
      margin-left: 0.5rem;
    }

    /* HERO CONTENT (INFORMAÇÕES DO FILME EM DESTAQUE) */
    .hero-content {
      margin-top: auto;
      margin-bottom: 1.5rem;
      max-width: 650px;
    }

    .provider-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .movie-title {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.6rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .movie-meta {
      font-size: 0.85rem;
      color: #c4c6d0;
      margin-bottom: 0.6rem;
    }

    .movie-desc {
      font-size: 0.95rem;
      color: #e3e2e6;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* SEÇÃO CARROSSEL DE FILMES EM DESTAQUE */
    .section-title {
      font-size: 0.85rem;
      color: #c4c6d0;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .featured-row {
      display: flex;
      gap: 1.2rem;
      overflow-x: hidden;
      padding: 0.5rem 0;
    }

    .featured-card {
      min-width: 180px;
      height: 102px;
      border-radius: 12px;
      overflow: hidden;
      background: #282a2f;
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      border: 2px solid transparent;
    }

    .featured-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .featured-card:focus {
      outline: none;
      transform: scale(1.08);
      border-color: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 10;
    }

    /* SEÇÃO "YOUR APPS" - ÍCONES ESTRITAMENTE CIRCULARES (ANDROID 14) */
    .apps-section {
      margin-top: 1.2rem;
    }

    .apps-row {
      display: flex;
      gap: 1.2rem;
      align-items: center;
      overflow-x: hidden;
      padding: 0.5rem 0;
    }

    /* CÍRCULO PERFEITO */
    .app-icon {
      min-width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #1e1f23;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      border: 2px solid transparent;
      overflow: hidden;
    }

    .app-icon img {
      width: 65%;
      height: 65%;
      object-fit: contain;
    }

    .app-icon:focus {
      outline: none;
      transform: scale(1.18);
      border-color: #ffffff;
      background-color: #2b2d33;
      box-shadow: 0 6px 20px rgba(255,255,255,0.25);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- VÍDEO DE FUNDO (BACKGROUND ANAMÓRFICO/DINÂMICO) -->
  <div class="bg-container">
    <video class="bg-video" autoplay loop muted playsinline id="bgVideo">
      <!-- Exemplo de vídeo de fundo trailer Mario Bros -->
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
  </div>

  <!-- CONTAINER DE INTERFACE -->
  <div class="app-container">

    <!-- TOP NAVIGATION BAR -->
    <header class="top-bar">
      <div class="nav-left">
        <div class="avatar" tabindex="0">R</div>
        <button class="nav-pill active" tabindex="0">For you</button>
        <button class="nav-pill" tabindex="0">Live</button>
        <button class="nav-pill" tabindex="0">Apps</button>
        <button class="nav-pill" tabindex="0">Library</button>
      </div>
      <div class="nav-right">
        <div class="icon-btn" tabindex="0" title="Pesquisar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <div class="icon-btn" tabindex="0" title="Configurações">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <span class="brand-title">Google TV</span>
      </div>
    </header>

    <!-- HERO MOVIE INFO (EXATAMENTE COMO NA IMAGEM) -->
    <div class="hero-content">
      <div class="provider-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>YouTube</span>
      </div>
      <h1 class="movie-title">The Super Mario Bros. Movie</h1>
      <div class="movie-meta">Trending | Brooklyn plumbers look to save the Mushroom Kingdom from Bowser's clutches</div>
    </div>

    <!-- ÁREA INFERIOR: CARROSSEL DE DESTAQUES + ÍCONES CIRCULARES -->
    <div class="bottom-section">
      
      <!-- CARROSSEL TOP PICKS FOR YOU -->
      <div class="section-title">Top picks for you</div>
      <div class="featured-row">
        <div class="featured-card" tabindex="0">
          <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&auto=format&fit=crop" alt="Barbie">
        </div>
        <div class="featured-card" tabindex="0">
          <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400&auto=format&fit=crop" alt="Oppenheimer">
        </div>
        <div class="featured-card" tabindex="0">
          <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=400&auto=format&fit=crop" alt="Equalizer 3">
        </div>
        <div class="featured-card" tabindex="0">
          <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop" alt="Monarch">
        </div>
        <div class="featured-card" tabindex="0">
          <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&auto=format&fit=crop" alt="Iron Claw">
        </div>
      </div>

      <!-- LINHA DE APLICATIVOS CIRCULARES (YOUR APPS - ANDROID 14) -->
      <div class="apps-section">
        <div class="section-title">Your apps</div>
        <div class="apps-row">
          
          <div class="app-icon" tabindex="0" title="Netflix" style="background:#000;">
            <span style="color:#E50914; font-weight:900; font-size:0.85rem;">NETFLIX</span>
          </div>

          <div class="app-icon" tabindex="0" title="YouTube" style="background:#FF0000;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFF"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          </div>

          <div class="app-icon" tabindex="0" title="Prime Video" style="background:#00A8E1;">
            <span style="color:#FFF; font-weight:bold; font-size:0.7rem; text-align:center;">prime<br>video</span>
          </div>

          <div class="app-icon" tabindex="0" title="Disney+" style="background:#113CCF;">
            <span style="color:#FFF; font-weight:bold; font-size:0.8rem;">Disney+</span>
          </div>

          <div class="app-icon" tabindex="0" title="Apple TV" style="background:#222;">
            <span style="color:#FFF; font-weight:500; font-size:0.85rem;">tv</span>
          </div>

          <div class="app-icon" tabindex="0" title="Max" style="background:#002BE7;">
            <span style="color:#FFF; font-weight:900; font-size:0.9rem; italic">max</span>
          </div>

          <div class="app-icon" tabindex="0" title="Paramount+" style="background:#0064FF;">
            <span style="color:#FFF; font-weight:bold; font-size:0.65rem; text-align:center;">Paramount+</span>
          </div>

          <div class="app-icon" tabindex="0" title="Hulu" style="background:#1CE783;">
            <span style="color:#000; font-weight:bold; font-size:0.85rem;">hulu</span>
          </div>

          <div class="app-icon" tabindex="0" title="Spotify" style="background:#1DB954;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#000"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-.1.2-1.2-.419-.18-.6.42-1.02.96-1.2 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- NAVEGAÇÃO POR CONTROLE REMOTO (TECLAS DIRECIONAIS / D-PAD) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const focusableElements = Array.from(document.querySelectorAll('[tabindex="0"]'));
      
      if (focusableElements.length > 0) {
        focusableElements[0].focus();
      }

      document.addEventListener('keydown', (e) => {
        const active = document.activeElement;
        const index = focusableElements.indexOf(active);

        if (index === -1) return;

        let nextIndex = index;

        switch (e.key) {
          case 'ArrowRight':
            nextIndex = (index + 1) % focusableElements.length;
            break;
          case 'ArrowLeft':
            nextIndex = (index - 1 + focusableElements.length) % focusableElements.length;
            break;
          case 'ArrowDown':
            // Navega para a linha/elemento de baixo se existir
            if (index + 5 < focusableElements.length) nextIndex = index + 5;
            break;
          case 'ArrowUp':
            // Navega para a linha/elemento de cima se existir
            if (index - 5 >= 0) nextIndex = index - 5;
            break;
        }

        if (focusableElements[nextIndex]) {
          focusableElements[nextIndex].focus();
        }
      });
    });
  </script>
</body>
</html>
