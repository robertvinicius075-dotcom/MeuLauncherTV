
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - Main
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          if [ ! -f "MeuLauncherTV.zip" ]; then
            echo "ERRO: MeuLauncherTV.zip não está na raiz do repositório."
            ls -la
            exit 1
          fi
          echo "ZIP encontrado!"
          unzip -l MeuLauncherTV.zip | head -80

      - name: Extrair projeto
        run: unzip -o MeuLauncherTV.zip -d projeto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Localizar projeto Android
        run: |
          echo "Procurando arquivos Gradle..."
          find projeto -maxdepth 6 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Compilar aplicativo
        run: |
          if [ -f "projeto/launcher-tv/gradlew" ]; then
            cd projeto/launcher-tv
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f "projeto/launcher-tv/settings.gradle" ] || [ -f "projeto/launcher-tv/settings.gradle.kts" ]; then
            cd projeto/launcher-tv
            gradle assembleDebug --no-daemon
          else
            echo "ERRO: Não encontrei o projeto Android em projeto/launcher-tv."
            echo "Veja os arquivos listados na etapa Localizar projeto Android."
            exit 1
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuLauncherTV-apk
          path: projeto/launcher-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
